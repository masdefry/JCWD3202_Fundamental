<script>
    const tollGates = [
        {gate: 'Surabaya'}, {mobil: 255000, bus: 293000, truck: 325000}, {gate: 'Solo'},
        {mobil: 55000, bus: 60000, truck: 75000}, {gate: 'Kalikangkung'}, 
        {mobil: 600000, bus: 620000, truck: 650000}, {gate: 'Cikampek'}
    ]

    const enterGate = prompt('Enter Gate')
    const exitGate = prompt('Exit Gate')
    const numberOfVehicle = prompt('1. Mobil \n 2. Bus \n 3. Truck') // 1 = mobil, 2 = bus, 3 = truck

    let vehicleType = ''
    if(numberOfVehicle == 1){
        vehicleType = 'mobil'
    }else if(numberOfVehicle == 2){
        vehicleType = 'bus'
    }else{
        vehicleType = 'truck'
    }

    const indexOfEnterGate = tollGates.findIndex(item => item?.gate?.toLowerCase() === enterGate.toLowerCase())
    const indexOfExitGate = tollGates.findIndex(item => item?.gate?.toLowerCase() === exitGate.toLowerCase())

    let total = 0
    for(let i=indexOfEnterGate; i<=indexOfExitGate; i++){
        if(tollGates[i][vehicleType] !== undefined){
            total+=tollGates[i][vehicleType]
        }
    }
    console.log(total)
</script>
