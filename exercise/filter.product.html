<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="text" />
    <button onclick="FindProduct()">
        Search Product
    </button>

    <div id="section-result">

    </div>
</body>
<script>
    const productsData = [
        { name: 'Apel', price: 35000 , stocks: 100 , unit: 'Kg', category: 'Buah' }, 
        { name: 'Anggur', price: 43000 , stocks: 50 , unit: 'Kg', category: 'Buah' }, 
        { name: 'Sawi', price: 2350 , stocks: 300 , unit: 'Pcs', category: 'Sayur' } 
    ]

    function FindProduct(){
        let input = document.getElementsByTagName('input')[0].value 

        const filteredProducts = productsData.filter(item => item.name === input)
        
        let output = ''
        filteredProducts.forEach(item => {
            output += `
                <h2>${item.name}</h2>
                Price: ${item.price}/${item.unit} <br/>
                Stocks: ${item.stocks} ${item.unit} <br/>

            `
        })

        if(output !== ''){
            document.getElementById('section-result').innerHTML = output
        }else{
            document.getElementById('section-result').innerHTML = `<h2>(!) Product Not Found</h2>`
        }
    }
</script>
</html>
