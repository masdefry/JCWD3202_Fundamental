<script>
    // PROMPT & ALERT
    // let input = prompt('Hello') // Menerima Input
    // alert(input)

    let num1 = Number(prompt('Input First Number'))
    let num2 = Number(prompt('Input Second Number'))
    let action = prompt('+, -, /, *')

    if(action === '+'){
        alert(num1 + num2)
    }else if(action === '-'){
        alert(num1 - num2)
    }
</script>
