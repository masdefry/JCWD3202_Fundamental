<script>
    const productsData = [
        { name: 'Apel', price: 35000 , stocks: 100 , unit: 'Kg', category: 'Buah' }, // 0+1 = 1
        { name: 'Anggur', price: 43000 , stocks: 50 , unit: 'Kg', category: 'Buah' }, // 1+1 = 2
        { name: 'Sawi', price: 2350 , stocks: 300 , unit: 'Pcs', category: 'Sayur' } // 2+1 = 3
    ]

    function PrintProducts(_products){
        let printProduct = ''
        
        _products.forEach((product, index) => {
            printProduct += `${index+1}. ${product.name} \n`
        })

        return printProduct
    }

    do{
        var selectedProduct = Number(prompt(`${PrintProducts(productsData)} \n Enter Product Number:`))-1 // 1 or 2 or 3
        console.log(selectedProduct)
        console.log(selectedProduct > productsData.length)
        console.log(selectedProduct < 1)
        if(selectedProduct > productsData.length || selectedProduct < 0){
            alert('Product Not Found!')
        }
    }while(selectedProduct > productsData.length || selectedProduct < 0)

    let inputQty = Number(prompt(`Input Qty to Buy:`))

    if(inputQty > productsData[selectedProduct].stocks){
        alert('Insufficient Stock!')
    }else{
        alert(`
            Are You Sure Want to Add to Cart this Product? \n
            Name: ${productsData[selectedProduct].name} \n
            Price: ${productsData[selectedProduct].price} \n
            Qty: ${inputQty}
        `)
    }
</script>
