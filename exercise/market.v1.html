<script>
    const products = [
        { name: 'Apel', price: 35000 , stocks: 100 , unit: 'Kg', category: 'Buah' },
        { name: 'Anggur', price: 43000 , stocks: 50 , unit: 'Kg', category: 'Buah' },
        { name: 'Sawi', price: 2350 , stocks: 300 , unit: 'Pcs', category: 'Sayur' }
    ]

    const input = prompt(`Type Product Name`)

    let itemFound = null // { name: 'Apel', price, stocks, ... }
    for(let item of products){
        if(input.toLowerCase() === item.name.toLowerCase()){
            itemFound = item
            break;
        }
    }

    if(itemFound === null){
        alert('Product Not Found')
    }else{
        alert(`
            Name: ${itemFound.name} \n
            Price: ${itemFound.price} \n
        `)
    }
</script>
