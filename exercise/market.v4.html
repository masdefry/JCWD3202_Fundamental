<script>

    ]

    function PrintProducts(_products){
        let printProduct = ''
        
        _products.forEach((product, index) => {

        })

        return printProduct
    }

    }while(indexOfProduct < 0 || indexOfProduct > productsData.length-1)

        var qty = prompt(`Input Your Qty`)
        var selectedProduct = productsData[indexOfProduct]

        }

    `)
    
</script>
